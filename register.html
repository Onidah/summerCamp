<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamp Veror</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row">
          <div class="col">
            <h1>Kampi Veror</h1>
          </div>
          <div class="col">
            <ul>
              <li>
                <a href="index.html">Kampet</a>
              </li>
              <li>
                <a href="about.html">Rreth Nesh</a>
              </li>
              <li>
                <a href="gallery.html">Galeria</a>
              </li>
              <li>
                <a href="contact.html">Kontakti</a>
              </li>
            </ul>
          </div>
          <div class="col">
            <a href="register.html" class="register">Regjistrohu</a>
          </div>
        </div>
      </div>
    </header>

    <section class="registration">
      <div class="container">
        <div class="row">
          <div class="col">
            <div class="text">
              <h2>Bashkohu me Aventurën!</h2>
              <p>
                Plotësoni të dhënat për të rezervuar vendin në Kampin Veror
                Albania.
              </p>
            </div>

            <form id="registrationForm">
              <div class="row">
                <div class="col">
                  <label for="firstName">Emri i Fëmijës</label>
                  <input
                    type="text"
                    id="firstName"
                    placeholder="Emri"
                    required
                  />
                </div>
                <div class="col">
                  <label for="program">Programi</label>
                  <input
                    type="text"
                    id="program"
                    placeholder="Programi"
                    required
                  />
                </div>
              </div>

              <label for="age">Mosha (Vjeç)</label>
              <input
                type="text"
                id="age"
                placeholder="Mosha (p.sh. 11 vjeç)"
                required
              />

              <div class="row">
                <div class="col">
                  <label for="parentName">Emri i Prindit/Kujdestarit</label>
                  <input
                    type="text"
                    id="parentName"
                    placeholder="Emri i Prindit"
                  />
                </div>
                <div class="col">
                  <label for="phone">Numri i Telefonit</label>
                  <input type="tel" id="phone" placeholder="+355 6..." />
                </div>
              </div>

              <button type="submit">
                Konfirmo Regjistrimin 
              </button>
            </form>
          </div>

          <!-- Kolona e Tabelës -->
          <div class="col">
            <h3>Regjistrimet e Fundit</h3>

            <table>
              <thead>
                <tr>
                  <th>Emri</th>
                  <th>Programi</th>
                  <th>Mosha</th>
                </tr>
              </thead>
              <tbody id="tableBody">
                <tr>
                  <td>Arbi K.</td>
                  <td>Aventurierët</td>
                  <td>11 vjeç</td>
                </tr>
                <tr>
                  <td>Lea M.</td>
                  <td>Eksploruesit</td>
                  <td>9 vjeç</td>
                </tr>
                <tr>
                  <td>Dritan S.</td>
                  <td>Liderët</td>
                  <td>13 vjeç</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
